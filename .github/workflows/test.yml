name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  self-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile script
        run: python -m py_compile skills/wechat-article-reader/scripts/read_wechat_article.py

      - name: Run deterministic self-test
        run: python skills/wechat-article-reader/scripts/read_wechat_article.py --self-test
